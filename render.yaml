services:
  - type: web
    name: neuroals-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production

  - type: static
    name: neuroals-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist